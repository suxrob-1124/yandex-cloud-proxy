# =============================================================
#  group_vars/all.yml
#  Variables available to all hosts
#  Secrets (Reality keys) are generated by the install.yml playbook
#  and saved in vars/secrets.yml (in .gitignore)
# =============================================================

# General service parameters
xray_port:         443
sub_port:          8443
# masquerade_host is set per-host in inventory (generated from Terraform)

# Per-user limits (policy level 0)
# bufferSize: 0 = unlimited, >0 = buffer limit in KB per connection
xray_user_conn_idle:  300     # idle connection timeout (sec)
xray_user_uplink_only:  2     # wait time after upload close (sec)
xray_user_downlink_only: 5    # wait time after download close (sec)

# Xray
xray_version:      "latest"
xray_config_dir:   "/usr/local/etc/xray"
xray_log_dir:      "/var/log/xray"
xray_bin:          "/usr/local/bin/xray"

# Nginx — serving client configs
sub_dir:           "/var/www/sub"
ssl_dir:           "/etc/nginx/ssl"

# State manager
manager_dir:       "/etc/xray-manager"
users_file:        "/etc/xray-manager/users.json"
sub_token_file:    "/etc/xray-manager/sub_token"

# SSH
ansible_user:      ubuntu

xray_secrets_file: "/etc/xray-manager/secrets.json"

# WARP (Cloudflare WireGuard)
warp_secrets_file: "/etc/xray-manager/warp.json"
# Use the IPv4 literal, NOT the engage.cloudflareclient.com hostname: the edge
# server has no working IPv6 egress (YC), and the hostname resolves to both A and
# AAAA. xray's WireGuard outbound would pick the AAAA endpoint and the handshake
# to Cloudflare would silently time out (Telegram/WARP dead). See docs/runbook.md.
warp_endpoint:     "162.159.192.1:2408"

# Chain proxy — settings in ansible/vars/chain.yml (in .gitignore)
# chain_proxy_addr and chain_proxy_port are set there

# Direct bypass — Russian services that must NOT go through WARP/chain
# (they block datacenter and Cloudflare IPs)
direct_domains:
  - "domain:vk.com"
  - "domain:vk.ru"
  - "domain:vkontakte.ru"
  - "domain:vkuserphoto.ru"
  - "domain:vk-analytics.ru"
  - "domain:vk.me"
  - "domain:vkvideo.ru"
  - "domain:yandex.ru"
  - "domain:ya.ru"
  - "domain:mail.ru"
  - "domain:ok.ru"
  - "domain:sberbank.ru"
  - "domain:gosuslugi.ru"

chain_domains:
  # AI services (strict geo-blocking, WARP cannot handle)
  - "domain:openai.com"
  - "domain:chatgpt.com"
  - "domain:ai.com"
  - "domain:anthropic.com"
  - "domain:claude.ai"
  - "domain:gemini.google.com"
  - "domain:bard.google.com"
  - "domain:aistudio.google.com"
  - "domain:generativelanguage.googleapis.com"
  - "domain:perplexity.ai"
  - "domain:midjourney.com"
  - "domain:suno.com"
  - "domain:copilot.microsoft.com"
  - "domain:hzhz.fibery.io"
  # Telegram — moved off WARP (blocked from RU datacenter IP) to the chain proxy.
  - "geosite:telegram"

# WARP — domains via Cloudflare WireGuard (non-Russian IP)
warp_domains:
  # Streaming
  - "domain:netflix.com"
  - "domain:netflix.net"
  - "domain:nflxvideo.net"
  - "domain:nflximg.net"
  - "domain:nflxso.net"
  - "domain:spotify.com"
  - "domain:scdn.co"
  - "domain:disneyplus.com"
  - "domain:max.com"
  # Video calls (throttled by TSPU, need a proper UDP path)
  - "domain:meet.google.com"
  - "domain:stun.l.google.com"
  - "domain:stun.google.com"
  - "domain:zoom.us"
  - "domain:zoom.com"
  - "domain:zoomgov.com"
  - "domain:teams.microsoft.com"
  - "domain:teams.live.com"
  - "domain:skype.com"
  # Social media and messengers (blocked/throttled in Russia)
  - "domain:instagram.com"
  - "domain:cdninstagram.com"
  - "domain:facebook.com"
  - "domain:fbcdn.net"
  - "domain:twitter.com"
  - "domain:x.com"
  - "domain:twimg.com"
  - "domain:discord.com"
  - "domain:discord.gg"
  - "domain:discordapp.com"
  # NOTE: Telegram moved to the chain proxy (see chain_domains/chain_ips).
  # The WARP tunnel is blocked by TSPU from the RU datacenter IP — the
  # WireGuard handshake to Cloudflare never completes, so WARP cannot carry
  # Telegram. The chain proxy (non-RU egress) reaches Telegram fine.
  # Video
  - "domain:youtube.com"
  - "domain:googlevideo.com"
  - "domain:ytimg.com"
  - "domain:ggpht.com"
  # Other geo-restricted
  - "domain:medium.com"
  - "domain:quora.com"
  - "domain:notion.so"
  - "domain:notion.site"
  - "domain:glassdoor.com"
  - "domain:linkedin.com"

# IP-based WARP routing — for protocols that connect by raw IP (no domain to match).
# (Telegram's geoip moved to chain_ips — WARP is blocked from the RU datacenter IP.)
# warp_ips:
#   - "..."

# IP-based chain routing — for protocols that connect by raw IP (no domain to match).
# Telegram (MTProto) dials its DC IPs directly, so geosite alone can't catch it.
chain_ips:
  - "geoip:telegram"
